name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry, index, and target
        uses: Swatinem/rust-cache@v2

      # Build all targets first so `cargo test` doesn't recompile bins. The
      # toffee-mcp integration test needs `toffeed` in the workspace target
      # dir; --workspace --all-targets guarantees that.
      - name: cargo build
        run: cargo build --workspace --all-targets --locked

      # Integration tests under bin/toffeed/tests and bin/toffee-mcp/tests
      # spawn the daemon with `--embedder hash`, so no BGE weights are
      # downloaded in CI.
      - name: cargo test
        run: cargo test --workspace --all-targets --locked

      # Memory-quality regression gate. The harness_smoke test already fails
      # the build if the corpus drops below threshold; this step also surfaces
      # the scorecard in the log for at-a-glance trend watching.
      - name: memory-quality eval
        run: cargo run -p toffee-eval --locked

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    # Blocking: the fmt drift was cleared, and a pre-commit hook keeps it
    # clean locally. Mirror the hook's check here so it can't drift back in.
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    # Blocking: the workspace is clippy-clean. Keep it that way — fix the lint
    # or add a scoped `#[allow]` with a reason rather than reintroducing drift.
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry, index, and target
        uses: Swatinem/rust-cache@v2
        with:
          # Separate cache key from the test job so a clippy-only run
          # doesn't pollute the test build cache and vice versa.
          shared-key: lint

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
