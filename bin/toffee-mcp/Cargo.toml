[package]
name = "toffee-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "toffee-mcp"
path = "src/main.rs"

[dependencies]
toffee-core = { workspace = true }
toffee-client = { workspace = true }
toffee-rpc = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rmcp = { version = "1.7", default-features = false, features = ["server", "macros", "transport-io"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
rmcp = { version = "1.7", default-features = false, features = ["client", "transport-child-process"] }
