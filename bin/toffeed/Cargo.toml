[package]
name = "toffeed"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "toffeed"
path = "src/main.rs"

[features]
default = []
# Forward to toffee-vector for Metal-accelerated BGE on macOS.
metal = ["toffee-runtime/metal"]

[dependencies]
toffee-core = { workspace = true }
toffee-store = { workspace = true }
toffee-runtime = { workspace = true }
toffee-vector = { workspace = true }
toffee-rpc = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
toffee-client = { workspace = true }
toffee-core = { workspace = true }
toffee-rpc = { workspace = true }
tempfile = "3"
