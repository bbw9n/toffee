[package]
name = "toffee-vector"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Opt into the Metal compute backend on macOS for the candle-backed BGE
# embedder. CPU works without this; Metal is faster on Apple Silicon.
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[dependencies]
toffee-core = { workspace = true }
hnsw_rs = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

# BGE backend: candle + tokenizers + hf-hub.
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
hf-hub = "0.3"

[dev-dependencies]
tempfile = "3"
