[workspace]
resolver = "2"
members = [
    "crates/toffee-core",
    "crates/toffee-store",
    "crates/toffee-vector",
    "crates/toffee-runtime",
    "crates/toffee-rpc",
    "crates/toffee-client",
    "crates/toffee-tap",
    "bin/toffeed",
    "bin/toffee",
    "bin/toffee-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"
repository = "https://github.com/example/toffee"
homepage = "https://github.com/example/toffee"
keywords = ["memory", "agents", "llm", "embeddings"]
categories = ["database", "data-structures"]

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# IDs
ulid = "1"

# Misc
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
libc = "0.2"

# Internal
toffee-core = { path = "crates/toffee-core", version = "0.1" }
toffee-store = { path = "crates/toffee-store", version = "0.1" }
toffee-runtime = { path = "crates/toffee-runtime", version = "0.1" }
toffee-vector = { path = "crates/toffee-vector", version = "0.1" }
toffee-rpc = { path = "crates/toffee-rpc", version = "0.1" }
toffee-client = { path = "crates/toffee-client", version = "0.1" }
toffee-tap = { path = "crates/toffee-tap", version = "0.1" }

# Tap
toml = "0.8"
glob = "0.3"
async-trait = "0.1"

# Worker
regex = "1"

# Vector
hnsw_rs = "0.3"
parking_lot = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1
